# Fuzzing with cargo-fuzz (libFuzzer). Requires a nightly toolchain:
#
#   rustup toolchain install nightly --profile minimal
#   cargo install cargo-fuzz
#
# The deterministic hostile corpus also runs on stable via:
#   cargo test --test security_fuzz_test
#
# NOTE: this crate is intentionally isolated from the parent workspace.

[package]
name = "sagashield-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.sagashield]
path = ".."

# Explicit bins: cargo-fuzz and plain `cargo build --bins` both work.
[[bin]]
name = "path_guard"
path = "fuzz_targets/path_guard.rs"

[[bin]]
name = "net_guard"
path = "fuzz_targets/net_guard.rs"

[workspace]
